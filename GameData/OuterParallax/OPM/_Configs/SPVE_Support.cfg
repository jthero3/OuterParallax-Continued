@Kopernicus:NEEDS[Parallax_StockTerrainTextures,SPVE_OPM]:FOR[zOuterParallaxs]
{
    @Body[Tekto]
    {
        // Add support for changes made by SPVE_OPM
        // Scaled fades need to match the PQS fades,
        // otherwise the scaled version will be 
        // ghost behind the PQS.
        @ScaledVersion
        {
            @fadeStart = 70000
            @fadeEnd = 80000
        }
        @PQS //280000
        {
            @fadeStart = 80000 //140000
            @fadeEnd = 120000 //280000
            @deactivateAltitude = 150000
        }
    }
}


@Scatterer_atmosphere:NEEDS[OPM,SPVE_OPM]:FOR[zOuterParallax]
{
        // Don't flatten the scaled space mesh for Tekto and Thatmo,
        // otherwise, parallax will not render correctly in scaled space.
    	@Atmo[Tekto]  { @flattenScaledSpaceMesh = 0 }
    	@Atmo[Thatmo] { @flattenScaledSpaceMesh = 0 }
}